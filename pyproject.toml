[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openvpn-cert-inspector"
dynamic = ["version"]
description = "Inspect, diagnose and monitor the X.509 certificate of an OpenVPN server through a handshake-only probe, without credentials."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehran Gharooni" }]
keywords = [
  "openvpn",
  "tls",
  "x509",
  "certificate",
  "pki",
  "monitoring",
  "nagios",
  "prometheus",
  "certificate-pinning",
  "network-security",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Networking",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2"]
figures = ["matplotlib>=3.8"]

[project.scripts]
ovpncert = "ovpncert.cli:main"

[project.urls]
Homepage = "https://github.com/Mhrnqaruni/openvpn-cert-inspector"
Documentation = "https://github.com/Mhrnqaruni/openvpn-cert-inspector/tree/main/docs"
Issues = "https://github.com/Mhrnqaruni/openvpn-cert-inspector/issues"
Changelog = "https://github.com/Mhrnqaruni/openvpn-cert-inspector/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/ovpncert/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ovpncert"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "lab", "docs", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a real OpenVPN binary (run by lab/run_lab.py or CI)"]

[tool.coverage.run]
source = ["ovpncert"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
