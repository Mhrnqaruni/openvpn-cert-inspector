name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/ovpncert/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          ovpncert --version
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* results/lab-openvpn2.json results/lab-openvpn3.json \
            --title "ovpncert $GITHUB_REF_NAME" --notes-file notes.md
